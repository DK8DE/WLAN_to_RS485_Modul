name: Build Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'partitions.csv') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-c5-n4

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          FW_VERSION="$(grep '#define FW_VERSION_STR' src/Version.h | sed 's/.*"\(.*\)".*/\1/')"
          HW_VERSION="$(grep '#define HW_VERSION_STR' src/Version.h | sed 's/.*"\(.*\)".*/\1/')"
          BUILD_DIR=".pio/build/esp32-c5-n4"
          OUT_DIR="dist"
          mkdir -p "$OUT_DIR"
          cp "$BUILD_DIR/firmware.bin" "$OUT_DIR/WLAN_to_RS485_v${FW_VERSION}_firmware.bin"
          cp "$BUILD_DIR/firmware.factory.bin" "$OUT_DIR/WLAN_to_RS485_v${FW_VERSION}_factory.bin"
          {
            echo "project=WLAN_to_RS485_Modul"
            echo "firmware_version=${FW_VERSION}"
            echo "hardware_version=${HW_VERSION}"
            echo "git_sha=${GITHUB_SHA}"
            echo "git_ref=${GITHUB_REF_NAME}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "firmware.bin       -> Web-OTA oder USB-Flash (App-Partition)"
            echo "firmware.factory.bin -> Erstes Flashen / komplettes Image mit Bootloader"
          } > "$OUT_DIR/BUILD_INFO.txt"
          echo "FW_VERSION=${FW_VERSION}" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-v${{ env.FW_VERSION }}-${{ github.run_number }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
