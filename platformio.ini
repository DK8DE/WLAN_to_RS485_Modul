; PlatformIO - WLAN_to_RS485 (ESP32-C5, Arduino)
; Bibliotheken unter lib/ (für Git/offline wie bei Rotor_Firmware)

[platformio]
default_envs = esp32-c5-n4

[env:esp32-c5-n4]
; Pioarduino-Platform: der ESP32-C5 wird von der offiziellen PlatformIO-Platform
; (bisher) nicht unterstützt, daher der pioarduino-Fork (Arduino-ESP32 3.x / ESP-IDF 5.5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; ESP32-C5-DevKitC-1 (4 MB Flash, kein PSRAM) – ggf. auf konkretes Modul anpassen
board = esp32-c5-devkitc-1
framework = arduino

upload_speed = 460800
monitor_speed = 115200
; COM-Port noch nicht fest hinterlegt (Board/Port erst bei Bedarf eintragen):
upload_port = COM5
monitor_port = COM5

; ESP32-C5 nutzt USB-Serial-JTAG statt eines externen USB-UART-Bausteins.
; Falls das konkrete Board/Modul dies benötigt, hier aktivieren:
; build_flags =
;     -DARDUINO_USB_MODE=1
;     -DARDUINO_USB_CDC_ON_BOOT=1
